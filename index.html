<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04060c" />
  <meta name="description" content="Halcyon — Audio Visualizer by T-Rex Blue Official" />
  <title>Halcyon · T-Rex Blue Official</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>

  <!-- Animated background layer (behind the visualizer) -->
  <div id="bg-ambient" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-glow bg-glow-a"></div>
    <div class="bg-glow bg-glow-b"></div>
    <div class="bg-grid"></div>
  </div>

  <div id="app"></div>

  <script>
    window.addEventListener("error", function (e) {
      showBootError(e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showBootError("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    function showBootError(msg) {
      var box = document.getElementById("boot-error");
      if (!box) {
        box = document.createElement("div");
        box.id = "boot-error";
        box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#2b0d0d;color:#ffdcdc;font:13px/1.5 monospace;padding:12px 16px;white-space:pre-wrap;max-height:40vh;overflow:auto";
        document.body.appendChild(box);
      }
      box.textContent += (box.textContent ? "\n" : "") + msg;
    }
  </script>

  <!-- Animated background script (pure visual, no logic coupling) -->
  <script>
    (function () {
      const bg = document.getElementById("bg-canvas");
      if (!bg) return;
      const ctx = bg.getContext("2d");
      let w = 0, h = 0, dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        bg.width = w * dpr;
        bg.height = h * dpr;
        bg.style.width = w + "px";
        bg.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", () => setTimeout(resize, 100));

      // ---- Floating particles ----
      const PARTICLE_COUNT = 70;
      const particles = [];
      function newParticle() {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.8 + 0.4,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          a: Math.random() * 0.5 + 0.15,
          hue: 210 + Math.random() * 40,
        };
      }
      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(newParticle());

      // ---- Soft moving gradient blobs ----
      const blobs = [
        { x: 0.25, y: 0.30, r: 0.55, hue: 215, phase: 0,   speed: 0.00018 },
        { x: 0.75, y: 0.70, r: 0.60, hue: 265, phase: 2.1, speed: 0.00022 },
        { x: 0.55, y: 0.20, r: 0.42, hue: 195, phase: 4.2, speed: 0.00026 },
      ];

      let t0 = performance.now();
      function frame(now) {
        const t = now - t0;
        ctx.clearRect(0, 0, w, h);

        // Layer 1 — soft moving gradient blobs
        for (const b of blobs) {
          const px = (b.x + Math.sin(t * b.speed + b.phase) * 0.05) * w;
          const py = (b.y + Math.cos(t * b.speed * 1.3 + b.phase) * 0.05) * h;
          const rad = b.r * Math.max(w, h) * 0.6;
          const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
          g.addColorStop(0, `hsla(${b.hue}, 80%, 55%, 0.10)`);
          g.addColorStop(0.5, `hsla(${b.hue}, 80%, 50%, 0.045)`);
          g.addColorStop(1, `hsla(${b.hue}, 80%, 50%, 0)`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
        }

        // Layer 2 — particles
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          // wrap
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
          if (p.y < -10) p.y = h + 10;
          if (p.y > h + 10) p.y = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${p.a})`;
          ctx.shadowColor = `hsla(${p.hue}, 90%, 60%, ${p.a * 0.8})`;
          ctx.shadowBlur = 8;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Layer 3 — subtle horizontal scan line shimmer
        const shimmerY = ((t * 0.02) % (h + 200)) - 100;
        const sg = ctx.createLinearGradient(0, shimmerY - 60, 0, shimmerY + 60);
        sg.addColorStop(0, "rgba(91, 157, 255, 0)");
        sg.addColorStop(0.5, "rgba(91, 157, 255, 0.04)");
        sg.addColorStop(1, "rgba(91, 157, 255, 0)");
        ctx.fillStyle = sg;
        ctx.fillRect(0, shimmerY - 60, w, 120);

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
